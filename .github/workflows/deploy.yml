name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - analysis/**
      - .kilo/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: louielangeloquisim/hris-fastapi/backend
  IMAGE_NAME_FRONTEND: louielangeloquisim/hris-fastapi/frontend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontendv3/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://api.hrisly.duckdns.org
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            C="docker compose -f compose.prod.yml"
            $C pull
            mkdir -p "$HOME/backups"
            $C exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$HOME/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            ls -t "$HOME"/backups/pre-deploy-*.sql.gz | tail -n +8 | xargs -r rm --
            $C run --rm -T --no-deps backend bash scripts/prestart.sh
            $C up -d --remove-orphans
            cid=$($C ps -q backend)
            s=starting
            for i in $(seq 1 36); do s=$(docker inspect -f '{{.State.Health.Status}}' "$cid"); [ "$s" = healthy ] && break; sleep 5; done
            [ "$s" = healthy ] || { $C logs --tail 60 backend; exit 1; }
            [ -f "$HOME/.hris_deployed_tag" ] && cp "$HOME/.hris_deployed_tag" "$HOME/.hris_previous_tag" || true
            echo "$IMAGE_TAG" > "$HOME/.hris_deployed_tag"
            docker image prune -f

  verify:
    needs: deploy
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Verify API and Frontend health
        run: |
          for i in $(seq 1 12); do
            api_code=$(curl -s -o /dev/null -w '%{http_code}' https://api.hrisly.duckdns.org/api/v1/utils/health-check/)
            fe_code=$(curl -s -o /dev/null -w '%{http_code}' https://dashboard.hrisly.duckdns.org/)
            echo "Attempt $i: api=$api_code fe=$fe_code"
            [ "$api_code" = "200" ] && [ "$fe_code" = "200" ] && exit 0
            sleep 10
          done
          exit 1

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WCH HRIS — Rewrite Blueprint</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-900:#081826;
    --navy-800:#0c2136;
    --navy-700:#123049;
    --grid:#1c3f5c;
    --cyan:#5eead4;
    --amber:#ffb454;
    --orange:#ff6b45;
    --ink:#dce9f2;
    --ink-dim:#7d9bb3;
    --ink-faint:#4f6b83;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--navy-900), var(--navy-900)),
      repeating-linear-gradient(0deg, var(--grid) 0px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, var(--grid) 0px, transparent 1px, transparent 32px);
    background-blend-mode:normal;
    opacity:1;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 20px 80px;
  }
  .grid-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(94,234,212,0.05) 0px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(94,234,212,0.05) 0px, transparent 1px, transparent 32px);
  }
  .wrap{max-width:900px; margin:0 auto; position:relative; z-index:1;}

  /* Title block, like a drawing's title stamp */
  .titleblock{
    border:1px solid var(--grid);
    background:rgba(18,48,73,0.35);
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .titleblock h1{
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin:0 0 4px;
    color:var(--cyan);
    font-weight:600;
  }
  .titleblock p{
    margin:0;
    font-size:12px;
    color:var(--ink-dim);
    font-family:var(--mono);
  }
  .titleblock .stamp{
    font-family:var(--mono);
    font-size:11px;
    text-align:right;
    color:var(--ink-faint);
    line-height:1.6;
  }
  .stamp .rev{color:var(--amber);}

  /* Overall progress dimension line */
  .overall{
    margin-bottom:26px;
  }
  .overall-label{
    display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    margin-bottom:6px; letter-spacing:0.06em;
  }
  .overall-track{
    height:6px; background:var(--navy-700); border:1px solid var(--grid);
    position:relative;
  }
  .overall-fill{
    height:100%; background:linear-gradient(90deg, var(--cyan), var(--amber));
    transition:width .3s ease;
  }

  /* Sheet tabs */
  .tabs{display:flex; gap:2px; margin-bottom:0;}
  .tab{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:10px 18px;
    background:var(--navy-800);
    border:1px solid var(--grid);
    border-bottom:none;
    color:var(--ink-faint);
    cursor:pointer;
    user-select:none;
  }
  .tab.active{
    color:var(--cyan);
    background:var(--navy-700);
    border-color:var(--cyan);
    border-bottom:1px solid var(--navy-700);
    margin-bottom:-1px;
    position:relative;
    z-index:2;
  }
  .sheet{
    border:1px solid var(--grid);
    background:rgba(12,33,54,0.55);
    padding:22px 22px 8px;
  }

  /* spine + phases */
  .spine{position:relative; padding-left:34px;}
  .spine::before{
    content:'';
    position:absolute; left:9px; top:6px; bottom:6px; width:1px;
    background:repeating-linear-gradient(0deg, var(--grid) 0 6px, transparent 6px 11px);
  }
  .phase{margin-bottom:22px; position:relative;}
  .phase-marker{
    position:absolute; left:-34px; top:2px;
    width:19px; height:19px;
    border:1px solid var(--grid);
    background:var(--navy-900);
    font-family:var(--mono); font-size:10px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint);
  }
  .phase.complete .phase-marker{
    border-color:var(--cyan); color:var(--cyan); background:rgba(94,234,212,0.08);
  }
  .phase.risk .phase-title-row .risk-tag{
    color:var(--orange); border-color:var(--orange);
  }

  .phase-header{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    cursor:pointer;
    padding-bottom:6px;
    border-bottom:1px dashed var(--grid);
  }
  .phase-title-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .phase-title{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink);}
  .phase-est{font-family:var(--mono); font-size:10px; color:var(--ink-faint);}
  .risk-tag{
    font-family:var(--mono); font-size:9px; letter-spacing:0.05em;
    border:1px solid var(--ink-faint); color:var(--ink-faint);
    padding:1px 5px; text-transform:uppercase;
  }
  .phase-progress{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim); white-space:nowrap;
  }
  .phase-progress .n-done{color:var(--cyan);}

  .items{
    padding:10px 0 4px 2px;
    display:grid;
    gap:7px;
  }
  .item{
    display:flex; align-items:flex-start; gap:9px;
    font-size:13px; color:var(--ink-dim);
    cursor:pointer;
    line-height:1.45;
  }
  .item:hover{color:var(--ink);}
  .checkbox{
    flex:0 0 auto;
    width:14px; height:14px;
    border:1px solid var(--ink-faint);
    margin-top:2px;
    position:relative;
  }
  .item.checked .checkbox{border-color:var(--cyan); background:rgba(94,234,212,0.15);}
  .item.checked .checkbox::after{
    content:''; position:absolute; left:2px; top:-1px;
    width:4px; height:8px;
    border-right:2px solid var(--cyan); border-bottom:2px solid var(--cyan);
    transform:rotate(40deg);
  }
  .item.checked{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--ink-faint);}

  .depends{
    font-family:var(--mono); font-size:10px; color:var(--amber);
    margin:2px 0 0 2px;
  }

  .tests-block{
    margin:12px 0 4px 2px;
    padding:10px 12px;
    border:1px dashed var(--ink-faint);
    background:rgba(255,180,84,0.04);
  }
  .tests-label{
    font-family:var(--mono); font-size:9px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--amber); margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .tests-label::before{
    content:''; width:8px; height:8px;
    border:1px solid var(--amber); transform:rotate(45deg);
  }
  .tests-list{ display:grid; gap:6px; }
  .test-item{
    display:flex; align-items:flex-start; gap:9px;
    font-size:12px; color:var(--ink-dim); line-height:1.45;
  }
  .test-marker{
    flex:0 0 auto; width:12px; height:12px; margin-top:2px;
    border:1px solid var(--amber); transform:rotate(45deg);
    position:relative;
  }
  .test-marker::after{
    content:''; position:absolute; inset:3px;
    background:rgba(255,180,84,0.35);
  }

  footer{
    max-width:900px; margin:24px auto 0;
    font-family:var(--mono); font-size:10px; color:var(--ink-faint);
    display:flex; justify-content:space-between;
    padding-top:10px;
  }
  .reset-btn{
    background:none; border:1px solid var(--ink-faint); color:var(--ink-faint);
    font-family:var(--mono); font-size:10px; padding:4px 10px; cursor:pointer;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .reset-btn:hover{border-color:var(--orange); color:var(--orange);}
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="wrap">

  <div class="titleblock">
    <div>
      <h1>WCH HRIS — Rewrite Blueprint</h1>
      <p>backend (fastapi) · frontendv3 (react) — phase tracking sheet</p>
    </div>
    <div class="stamp">DRAWN FROM: wchhris-api / wchhris<br>STATUS: <span class="rev">in progress</span></div>
  </div>

  <div class="overall">
    <div class="overall-label"><span id="overall-text">0 / 0 items checked</span><span id="overall-pct">0%</span></div>
    <div class="overall-track"><div class="overall-fill" id="overall-fill" style="width:0%"></div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-sheet="backend">Sheet 01 — Backend</div>
    <div class="tab" data-sheet="frontend">Sheet 02 — Frontend</div>
  </div>
  <div class="sheet" id="sheet-container"></div>

  <footer>
    <span id="sheet-summary"></span>
    <button class="reset-btn" id="reset-btn">Reset this sheet</button>
  </footer>
</div>

<script>
const DATA = {
  backend: [],
  frontend: [],
};

let state = {};
let currentSheet = "backend";
const STORAGE_KEY = "wch-hris-roadmap-progress";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : {};
  }catch(e){ state = {}; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function itemKey(sheet, phaseId, idx){ return sheet+"::"+phaseId+"::"+idx; }

function phaseTitleById(id){
  const all = [].concat(DATA.backend || [], DATA.frontend || []);
  const p = all.find(p => p.id === id);
  return p ? p.title : id;
}

function render(){
  const container = document.getElementById('sheet-container');
  container.innerHTML = '';
  const spine = document.createElement('div');
  spine.className = 'spine';

  let sheetDone = 0, sheetTotal = 0;

  DATA[currentSheet].forEach(phase => {
    const est = phase.estimate !== undefined ? phase.estimate : phase.est;
    const isRisk = phase.riskLevel === 'high' || phase.risk;
    const total = phase.items.length;
    let done = 0;
    phase.items.forEach((_, idx) => { if(state[itemKey(currentSheet, phase.id, idx)]) done++; });
    sheetDone += done; sheetTotal += total;

    const phaseEl = document.createElement('div');
    phaseEl.className = 'phase' + (done===total ? ' complete':'') + (isRisk ? ' risk':'');

    const dependsText = phase.dependsOn
      ? 'Depends on: ' + phaseTitleById(phase.dependsOn)
      : (phase.depends || '');

    phaseEl.innerHTML = `
      <div class="phase-marker">${phase.id.slice(1)}</div>
      <div class="phase-header" data-toggle="${phase.id}">
        <div class="phase-title-row">
          <span class="phase-title">${phase.title}</span>
          <span class="phase-est">${est}</span>
          ${isRisk ? '<span class="risk-tag">high risk</span>' : ''}
        </div>
        <div class="phase-progress"><span class="n-done">${done}</span>/${total}</div>
      </div>
      ${dependsText ? `<div class="depends">${dependsText}</div>` : ''}
      <div class="items" id="items-${phase.id}"></div>
    `;
    spine.appendChild(phaseEl);

    const itemsEl = phaseEl.querySelector('.items');
    phase.items.forEach((item, idx) => {
      const text = typeof item === 'string' ? item : item.text;
      const key = itemKey(currentSheet, phase.id, idx);
      const checked = !!state[key];
      const row = document.createElement('div');
      row.className = 'item' + (checked ? ' checked':'');
      row.innerHTML = `<div class="checkbox"></div><div>${text}</div>`;
      row.addEventListener('click', () => {
        state[key] = !state[key];
        saveState();
        render();
      });
      itemsEl.appendChild(row);
    });

    if(phase.testsRequired && phase.testsRequired.length){
      const testsEl = document.createElement('div');
      testsEl.className = 'tests-block';
      const label = document.createElement('div');
      label.className = 'tests-label';
      label.textContent = 'TESTS · Definition of Done';
      testsEl.appendChild(label);
      const list = document.createElement('div');
      list.className = 'tests-list';
      phase.testsRequired.forEach(t => {
        const tRow = document.createElement('div');
        tRow.className = 'test-item';
        tRow.innerHTML = `<span class="test-marker"></span><span>${t}</span>`;
        list.appendChild(tRow);
      });
      testsEl.appendChild(list);
      phaseEl.appendChild(testsEl);
    }
  });

  container.appendChild(spine);

  const pct = sheetTotal ? Math.round((sheetDone/sheetTotal)*100) : 0;
  document.getElementById('sheet-summary').textContent =
    `SHEET ${currentSheet.toUpperCase()}: ${sheetDone}/${sheetTotal} ITEMS (${pct}%)`;

  renderOverall();
}

function renderOverall(){
  let done=0, total=0;
  Object.keys(DATA).forEach(sheet=>{
    DATA[sheet].forEach(phase=>{
      phase.items.forEach((_, idx)=>{
        total++;
        if(state[itemKey(sheet, phase.id, idx)]) done++;
      });
    });
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('overall-text').textContent = `${done} / ${total} items checked`;
  document.getElementById('overall-pct').textContent = pct + '%';
  document.getElementById('overall-fill').style.width = pct + '%';
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentSheet = tab.dataset.sheet;
    render();
  });
});

document.getElementById('reset-btn').addEventListener('click', ()=>{
  DATA[currentSheet].forEach(phase=>{
    phase.items.forEach((_, idx)=>{ delete state[itemKey(currentSheet, phase.id, idx)]; });
  });
  saveState();
  render();
});

async function loadPhases(sheet, url){
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    DATA[sheet] = Array.isArray(data.phases) ? data.phases : [];
  }catch(e){
    console.error('Failed to load ' + url, e);
    DATA[sheet] = [];
  }
}

(async () => {
  await loadState();
  await Promise.all([
    loadPhases('backend', 'roadmap/backend-phases.json'),
    loadPhases('frontend', 'roadmap/frontend-phases.json')
  ]);
  // Seed progress from the JSON `done` flags so the sheet reflects what's
  // actually complete, without clobbering any manual toggle the user made in
  // this browser (state[key] wins when it is already set).
  Object.keys(DATA).forEach(sheet => {
    DATA[sheet].forEach(phase => {
      phase.items.forEach((item, idx) => {
        const key = itemKey(sheet, phase.id, idx);
        const done = typeof item === "object" && item.done === true;
        if (done && state[key] === undefined) state[key] = true;
      });
    });
  });
  saveState();
  render();
})();
</script>
</body>
</html>
